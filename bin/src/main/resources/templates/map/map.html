<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>클래스 지도</title>
    <!-- Tailwind CSS (예시용 CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 좌측 사이드바 스크롤 처리 */
        .sidebar {
            height: calc(100vh - 180px); /* 헤더, 필터 영역 제외한 높이 */
            overflow-y: auto;
        }
        /* 지도 영역 높이 고정 */
        #map {
            height: calc(100vh - 180px);
        }
    </style>
</head>
<body class="bg-gray-50">

    <!-- 1. 헤더 & 필터 영역 (상단 고정 요소들 생략/간략화) -->
    <header class="p-4 bg-white border-b">
        <h1 class="text-2xl font-bold text-gray-800">클래스 지도</h1>
    </header>

    <!-- 2. 메인 컨텐츠 영역 (2컬럼 Flexbox) -->
    <div class="flex w-full">
        
        <!-- 좌측 사이드바: 클래스 목록 -->
        <div class="w-[400px] bg-white border-r sidebar p-4 flex flex-col gap-4">
            <div class="text-sm font-semibold text-gray-500">
                총 <span th:text="${classList.size()}">0</span>개의 클래스
            </div>
            
            <!-- 클래스 카드 리스트 반복문 -->
            <div th:each="item : ${classList}" 
                 class="flex gap-4 p-3 border rounded-lg hover:shadow-md transition cursor-pointer class-card"
                 th:data-lat="${item.latitude}"
                 th:data-lng="${item.longitude}"
                 th:data-title="${item.title}">
                
                <img th:src="${item.imageUrl}" class="w-24 h-24 object-cover rounded-md" alt="클래스 이미지">
                
                <div class="flex-1 flex flex-col justify-between">
                    <div>
                        <span class="text-xs bg-gray-100 px-2 py-0.5 rounded text-gray-600 font-medium" th:text="${item.category}">카테고리</span>
                        <h3 class="font-bold text-sm mt-1 text-gray-800" th:text="${item.title}">클래스 제목</h3>
                        <p class="text-xs text-gray-500 mt-0.5" th:text="${item.address}">주소</p>
                        <p class="text-xs text-gray-400" th:text="${#temporals.format(item.classDate, 'yyyy.MM.dd (E) HH:mm')}">일정</p>
                    </div>
                    <div class="text-right">
                        <span class="font-bold text-sm text-gray-900" th:text="${#numbers.formatInteger(item.price, 3, 'COMMA') + '원'}">0원</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- 우측 영역: 지도 -->
        <div class="flex-1 relative">
            <div id="map" class="w-full"></div>
        </div>
    </div>

    <!-- 카카오 지도 API 로드 (자신의 APP KEY를 입력하세요) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_MAP_APP_KEY&libraries=services"></script>
    
    <!-- 타임리프 데이터를 JS로 넘겨받기 위한 인라인 설정 -->
    <script th:inline="javascript">
        /*<![CDATA[*/
        const classListData = /*[[${classList}]]*/ [];
        /*]]>*/
    </script>
    
    <script>
        // 지도 초기화
        const mapContainer = document.getElementById('map');
        const mapOption = {
            center: new kakao.maps.LatLng(37.566826, 126.9786567), // 기본 중심 좌표 (서울시청)
            level: 5 // 지도의 확대 레벨
        };
        const map = new kakao.maps.Map(mapContainer, mapOption);

        // 마커 이미지 커스터마이징 (카테고리별 아이콘을 다르게 설정하고 싶을 때 활용)
        const markerImageSrc = {
            '베이킹': 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png', // 예시 이미지 경로
            '캔들': 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/markerStar.png',
            'default': 'https://t1.daumcdn.net/localimg/localimages/07/mapapidoc/marker_red.png'
        };

        const bounds = new kakao.maps.LatLngBounds();

        // 타임리프에서 넘어온 데이터를 기반으로 지도에 마커 표시
        classListData.forEach(item => {
            if (item.latitude && item.longitude) {
                const markerPosition = new kakao.maps.LatLng(item.latitude, item.longitude);
                
                // 마커 이미지 생성
                const imageSize = new kakao.maps.Size(24, 35); 
                const iconUrl = markerImageSrc[item.category] || markerImageSrc['default'];
                const markerImage = new kakao.maps.MarkerImage(iconUrl, imageSize);

                // 마커 생성
                const marker = new kakao.maps.Marker({
                    position: markerPosition,
                    title: item.title,
                    image: markerImage,
                    map: map
                });

                // 지도 범위에 이 좌표 추가 (화면에 마커들이 모두 들어오도록 자동 조정용)
                bounds.extend(markerPosition);

                // 마커 클릭 시 정보창(InfoWindow) 표시 이벤트
                const infowindow = new kakao.maps.InfoWindow({
                    content: `<div style="padding:5px; font-size:12px; font-weight:bold;">${item.title}</div>`
                });

                kakao.maps.event.addListener(marker, 'click', function() {
                    infowindow.open(map, marker);
                });
            }
        });

        // 모든 마커가 화면 안에 다 들어올 수 있도록 지도의 중심과 레벨 재조정
        if (classListData.length > 0) {
            map.setBounds(bounds);
        }

        // 좌측 리스트 카드 클릭 시 해당 마커 위치로 지도 이동 기능
        document.querySelectorAll('.class-card').forEach(card => {
            card.addEventListener('click', function() {
                const lat = parseFloat(this.getAttribute('data-lat'));
                const lng = parseFloat(this.getAttribute('data-lng'));
                if (lat && lng) {
                    const moveLatLng = new kakao.maps.LatLng(lat, lng);
                    map.panTo(moveLatLng); // 부드럽게 이동
                }
            });
        });
    </script>
</body>
</html>
