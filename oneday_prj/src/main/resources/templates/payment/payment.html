<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>결제하기</title>

<link rel="stylesheet" href="../payment.css">

<!-- 아이콘 -->
<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
</head>

<body>

	<header>

		<div class="logo">Class 101</div>

		<nav>

			<a href="">로그아웃</a> <a href="">고객센터</a> <a href="">마이페이지</a> <a
				href="">예약내역</a> <a href="">관심목록</a>

		</nav>

	</header>

	<main class="payment-page">

		<h1>결제하기</h1>

		<p class="sub">주문 정보를 확인하고 결제를 진행해주세요.</p>

		<!-- 진행바 -->

		<div class="step">

			<div class="on">
				<span>1</span> 클래스 선택
			</div>

			<div>
				<span>2</span> 예약 정보
			</div>

			<div class="active">
				<span>3</span> 결제
			</div>

			<div>
				<span>4</span> 결제 완료
			</div>

		</div>

		<div class="container">

			<!-- 왼쪽 -->

			<section class="left">

				<!-- 주문정보 -->

				<div class="card">

					<h2>1. 주문 정보</h2>

					<div class="product">

						<img src="images/bread.jpg">

						<div class="info">

							<h3 th:text="classInfo.className">토끼 빵 만들기</h3>

							<span class="badge" th:text="classInfo.categoryName">베이킹</span>

							<p>
								<i class="fa-regular fa-calendar"></i> 2026.07.25 14:00 ~ 16:30
							</p>

							<p>
								<i class="fa-solid fa-location-dot"></i> 서울 마포구
							</p>

							<p>
								<i class="fa-regular fa-user"></i> 성인 1명
							</p>

						</div>

						<div class="price">45,000원</div>

					</div>

				</div>

				<!-- 결제수단 -->

				<div class="card">

					<h2>3. 결제 수단</h2>

					<label class="pay active"> <input type="radio" name="pay"
						checked>

						<div>

							<strong>신용카드</strong>

							<p>카드로 간편하게 결제</p>

						</div>

					</label> <label class="pay"> <input type="radio" name="pay">

						<div>

							<strong>네이버페이</strong>

							<p>네이버페이 결제</p>

						</div>

					</label> <label class="pay"> <input type="radio" name="pay">

						<div>

							<strong>무통장입금</strong>

							<p>가상계좌 입금</p>

						</div>

					</label>

					<button class="pay-btn">45,000원 결제하기</button>

				</div>

			</section>

			<!-- 오른쪽 -->

			<aside class="right">

				<div class="summary">

					<h3>주문 요약</h3>

					<div class="row">
						<span>클래스 금액</span> <strong>45,000원</strong>
					</div>

					<div class="row">
						<span>수수료</span> <strong>0원</strong>
					</div>

					<div class="row total">

						<span>최종 결제 금액</span> <strong>45,000원</strong>

					</div>

				</div>

			</aside>

		</div>

	</main>

</body>
</html>
